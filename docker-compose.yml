services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nuqta
      MYSQL_USER: nuqta
      MYSQL_PASSWORD: nuqta-local-password
      MYSQL_ROOT_PASSWORD: root-local-password
    ports:
      - "3307:3306"
    volumes:
      - nuqta_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot-local-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://nuqta:nuqta-local-password@database:3306/nuqta
      APP_ID: nuqta-local
      APP_SECRET: change-this-local-secret
      OWNER_UNION_ID: seed-mahmoud-admin
    ports:
      - "3000:3000"

volumes:
  nuqta_mysql:
