name: NUQTA verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nuqta
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NODE_ENV: development
      DATABASE_URL: mysql://root:root-password@127.0.0.1:3306/nuqta
      APP_ID: nuqta-ci
      APP_SECRET: ci-only-secret-change-me
      OWNER_UNION_ID: seed-mahmoud-admin
      E2E_FULL_FLOW: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create test schema
        run: npm run db:migrate
      - name: Seed disposable test database
        run: npm run db:seed
      - name: Run full browser flow
        run: npm run test:e2e
