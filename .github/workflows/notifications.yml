name: Process NUQTA notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process queued notifications
        env:
          APP_URL: ${{ secrets.NUQTA_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "x-cron-secret: $CRON_SECRET" \
            "$APP_URL/api/cron/notifications"
