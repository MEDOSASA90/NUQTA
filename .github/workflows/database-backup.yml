name: Backup NUQTA database

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes mysql-client
      - name: Create database backup
        env:
          DB_HOST: ${{ secrets.NUQTA_DB_HOST }}
          DB_PORT: ${{ secrets.NUQTA_DB_PORT }}
          DB_USER: ${{ secrets.NUQTA_DB_USER }}
          DB_PASSWORD: ${{ secrets.NUQTA_DB_PASSWORD }}
          DB_NAME: ${{ secrets.NUQTA_DB_NAME }}
        run: |
          test -n "$DB_HOST"
          test -n "$DB_PORT"
          test -n "$DB_USER"
          test -n "$DB_PASSWORD"
          test -n "$DB_NAME"
          umask 077
          mysqldump \
            --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" \
            --password="$DB_PASSWORD" --ssl-mode=REQUIRED \
            --single-transaction --routines --triggers "$DB_NAME" \
            | gzip > nuqta-backup-$(date -u +%Y-%m-%d).sql.gz
      - name: Upload private backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuqta-database-backup-${{ github.run_id }}
          path: nuqta-backup-*.sql.gz
          retention-days: 90
